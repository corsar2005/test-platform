services:
  - type: web
    name: python-test-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NEON_DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
